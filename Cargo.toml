[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/poulzinho/jukelight"
rust-version = "1.93"

[workspace.dependencies]
jukelight-domain = { path = "crates/domain" }
jukelight-application = { path = "crates/application" }
jukelight-adapter-bluos = { path = "crates/adapter-bluos" }
jukelight-adapter-fake = { path = "crates/adapter-fake" }
jukelight-adapter-artwork = { path = "crates/adapter-artwork" }
jukelight-adapter-http = { path = "crates/adapter-http" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
expect_used = "warn"

[profile.release]
lto = "thin"
strip = true
