# cargo-deny configuration: licences, advisories, bans and sources.
# Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Licences compatible with distributing Jukelight under MIT.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.9
# Narrow exceptions, reviewed one by one.
exceptions = [
    # Build-time only: used by rust-embed's folder-path interpolation inside
    # a proc macro; unmodified and not part of the binary. MPL-2.0 is
    # file-level copyleft and compatible with distributing Jukelight as MIT.
    { allow = ["MPL-2.0"], crate = "option-ext" },
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
