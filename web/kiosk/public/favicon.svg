<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Jukelight: a neon jukebox, in a dark and a light palette that follow
       the browser's colour scheme. Flat shapes on a 64-unit grid: at 16 px,
       4 units are 1 px, so the tubes stay sharp. -->
  <style>
    /* Dark (the default): violet, cyan and pink neon on ink. */
    .tile { fill: #0c0d14 }
    .left { stroke: #8b5cf6 } .left-end { fill: #8b5cf6 }
    .top { stroke: #22d3ee }
    .right { stroke: #f472b6 } .right-end { fill: #f472b6 }
    .disc { fill: #f5f5fa } .label { fill: #8b5cf6 } .hole { fill: #0c0d14 } .groove { stroke: #0c0d14 }
    .eq { fill: #22d3ee }
    .sheen { display: none }
    /* Light: ink, teal and terracotta on a cream tile. */
    @media (prefers-color-scheme: light) {
      .tile { fill: #f3efe6 }
      .left { stroke: #1f2a44 } .left-end { fill: #1f2a44 }
      .top { stroke: #17a398 }
      .right { stroke: #e0703f } .right-end { fill: #e0703f }
      .disc { fill: #e0703f } .label { fill: #f3efe6 } .hole { fill: #1f2a44 } .groove { stroke: #1f2a44 }
      .eq { fill: #17a398 }
      .sheen { display: inline }
    }
  </style>
  <!-- The tile: a squircle -->
  <path d="M64.00 32.00 L63.97 42.75 L63.89 46.17 L63.75 48.64 L63.56 50.64 L63.31 52.32 L63.00 53.79 L62.64 55.09 L62.21 56.25 L61.72 57.30 L61.17 58.24 L60.55 59.09 L59.86 59.86 L59.09 60.55 L58.24 61.17 L57.30 61.72 L56.25 62.21 L55.09 62.64 L53.79 63.00 L52.32 63.31 L50.64 63.56 L48.64 63.75 L46.17 63.89 L42.75 63.97 L32.00 64.00 L21.25 63.97 L17.83 63.89 L15.36 63.75 L13.36 63.56 L11.68 63.31 L10.21 63.00 L8.91 62.64 L7.75 62.21 L6.70 61.72 L5.76 61.17 L4.91 60.55 L4.14 59.86 L3.45 59.09 L2.83 58.24 L2.28 57.30 L1.79 56.25 L1.36 55.09 L1.00 53.79 L0.69 52.32 L0.44 50.64 L0.25 48.64 L0.11 46.17 L0.03 42.75 L0.00 32.00 L0.03 21.25 L0.11 17.83 L0.25 15.36 L0.44 13.36 L0.69 11.68 L1.00 10.21 L1.36 8.91 L1.79 7.75 L2.28 6.70 L2.83 5.76 L3.45 4.91 L4.14 4.14 L4.91 3.45 L5.76 2.83 L6.70 2.28 L7.75 1.79 L8.91 1.36 L10.21 1.00 L11.68 0.69 L13.36 0.44 L15.36 0.25 L17.83 0.11 L21.25 0.03 L32.00 0.00 L42.75 0.03 L46.17 0.11 L48.64 0.25 L50.64 0.44 L52.32 0.69 L53.79 1.00 L55.09 1.36 L56.25 1.79 L57.30 2.28 L58.24 2.83 L59.09 3.45 L59.86 4.14 L60.55 4.91 L61.17 5.76 L61.72 6.70 L62.21 7.75 L62.64 8.91 L63.00 10.21 L63.31 11.68 L63.56 13.36 L63.75 15.36 L63.89 17.83 L63.97 21.25Z" class="tile"/>
  <!-- Neon tubes, with a small gap at each joint -->
  <path d="M14 54V28A18 18 0 0 1 18.50 16.10" fill="none" class="left" stroke-width="4"/>
  <circle cx="14" cy="54" r="2" class="left-end"/>
  <path d="M20.10 14.50A18 18 0 0 1 43.90 14.50" fill="none" class="top" stroke-width="4"/>
  <path d="M45.50 16.10A18 18 0 0 1 50 28V54" fill="none" class="right" stroke-width="4"/>
  <circle cx="50" cy="54" r="2" class="right-end"/>
  <!-- The record: a groove, a highlight (light only), the label and the hole -->
  <circle cx="32" cy="30" r="10.5" class="disc"/>
  <circle cx="32" cy="30" r="7.6" fill="none" class="groove" stroke-opacity=".18" stroke-width="1"/>
  <path d="M24.86 27.40A7.6 7.6 0 0 1 28.79 23.11" fill="none" class="sheen" stroke="#fff" stroke-opacity=".7" stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="32" cy="30" r="4" class="label"/>
  <circle cx="32" cy="30" r="1.2" class="hole"/>
  <!-- A small equaliser -->
  <rect x="21.9" y="48" width="2.2" height="3" rx="1.1" class="eq"/>
  <rect x="26.4" y="45" width="2.2" height="6" rx="1.1" class="eq"/>
  <rect x="30.9" y="43" width="2.2" height="8" rx="1.1" class="eq"/>
  <rect x="35.4" y="46" width="2.2" height="5" rx="1.1" class="eq"/>
  <rect x="39.9" y="47.5" width="2.2" height="3.5" rx="1.1" class="eq"/>
</svg>
