name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, tests, deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the version pinned in rust-toolchain.toml, with caching.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Without a kiosk build, a placeholder page is embedded (see adapter-http/build.rs).
      - run: cargo test --workspace
      - uses: EmbarkStudios/cargo-deny-action@v2

  web:
    name: Kiosk (lint, typecheck, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/kiosk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/kiosk/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: End to end (screenshots, landscape and portrait)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/kiosk/package-lock.json
      # Installs the version pinned in rust-toolchain.toml, with caching.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - name: Build the kiosk
        working-directory: web/kiosk
        run: npm ci && npm run build
      - name: Build the backend (embeds the kiosk)
        run: cargo build --bin jukelight
      - name: Install Chromium
        working-directory: web/kiosk
        run: npx playwright install --with-deps chromium
      - name: Run the screenshot tests
        working-directory: web/kiosk
        run: npm run e2e
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-screenshots
          path: web/kiosk/test-results/
          retention-days: 14

  docker:
    name: Docker image (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
