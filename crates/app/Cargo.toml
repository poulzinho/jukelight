[package]
name = "jukelight"
description = "Jukelight: now-playing kiosk for BluOS players"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "jukelight"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
jukelight-adapter-artwork = { version = "0.1.0", path = "../adapter-artwork" }
jukelight-adapter-bluos = { version = "0.1.0", path = "../adapter-bluos" }
jukelight-adapter-fake = { version = "0.1.0", path = "../adapter-fake" }
jukelight-adapter-http = { version = "0.1.0", path = "../adapter-http" }
jukelight-adapter-music-assistant = { version = "0.1.0", path = "../adapter-music-assistant" }
jukelight-application = { version = "0.1.0", path = "../application" }
jukelight-domain = { version = "0.1.0", path = "../domain" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[dev-dependencies]
futures = "0.3.34"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
