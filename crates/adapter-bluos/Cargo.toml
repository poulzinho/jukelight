[package]
name = "jukelight-adapter-bluos"
description = "Jukelight adapter-bluos"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
futures = "0.3.34"
jukelight-application = { version = "0.1.0", path = "../application" }
jukelight-domain = { version = "0.1.0", path = "../domain" }
quick-xml = "0.41.0"
reqwest = { version = "0.13.5", default-features = false }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
axum = "0.8.9"
regex = "1.13.1"
tokio = { version = "1.54.1", features = ["full"] }
