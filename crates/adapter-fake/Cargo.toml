[package]
name = "jukelight-adapter-fake"
description = "Jukelight adapter-fake"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
base64 = "0.23.1"
futures = "0.3.34"
image = { version = "0.25.10", default-features = false, features = ["png"] }
jukelight-application = { version = "0.1.0", path = "../application" }
jukelight-domain = { version = "0.1.0", path = "../domain" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["sync", "rt", "macros", "time"] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full"] }
